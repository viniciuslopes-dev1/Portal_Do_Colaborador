<style>

    --text: #111827;
    --muted: #526075;
    --line: #dce3ea;
    --side: #f5f7f8;
  }
  * {
    box-sizing: border-box;
  }
  [hidden] {
    display: none !important;
  }

    margin: 0;
    color: var(--text);
    background: white;
    font:
      16px/1.5 system-ui,
      -apple-system,
      "Segoe UI",
      sans-serif;
  }
  button,
  input,
  select {
    font: inherit;
  }
  button,
  a,
  input,
  select {
    touch-action: manipulation;
  }
  button {
    cursor: pointer;
  }
  button:disabled {
    cursor: not-allowed;
    color: #697586;
    background: #edf0f3;
    border-color: #bac2cc;
  }
  button,
  input,
  select {
    min-height: 44px;
    border: 1px solid #7d8999;
    border-radius: 4px;
    background: white;
    padding: 9px 14px;
    color: var(--navy);
  }
  button:hover:enabled {
    background: #e9eef2;
  }
  button.primary {
    background: var(--navy);
    border-color: var(--navy);
    color: white;
  }
  button.primary:hover:enabled {
    background: #1c2d47;
  }
  :focus-visible {
    outline: 2px solid var(--navy);
    outline-offset: 3px;
  }
  a {
    color: var(--navy);
    text-underline-offset: 4px;
  }

    position: absolute;
    top: -80px;
    left: 16px;
    background: white;
    padding: 12px;
    z-index: 10;
  }
  .skip:focus {
    top: 8px;
  }

    display: grid;
    grid-template-columns: 240px minmax(0, 1fr);
    min-height: 100vh;
  }
  .sidebar {
    background: var(--side);
    border-right: 1px solid var(--line);
    padding: 32px 20px;
    display: flex;
    flex-direction: column;
  }
  .brand {
    display: flex;
    gap: 12px;
    align-items: center;
    color: var(--navy);
  }
  .brand-mark {
    width: 36px;
    height: 36px;
    background: var(--navy);
    color: white;
    display: grid;
    place-items: center;
    font-size: 18px;
    font-weight: 700;
    border-radius: 4px;
  }
  .brand strong {
    font-size: 15px;
    line-height: 1.3;
  }
  .sidebar small {
    display: block;
    margin: 12px 0 32px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.06em;
  }
  .nav {
    display: grid;
    gap: 8px;

    background: transparent;
    padding: 12px;
    min-height: 48px;
    font-size: 14px;
  }
  .nav button[aria-current="page"] {
    background: #e9eef2;
    border-left-color: var(--navy);
    font-weight: 650;
  }
  .nav-icon {
    display: inline-block;
    width: 28px;
    font-size: 18px;
  }
  .sidebar-bottom {
    margin-top: auto;
    padding-top: 40px;
    color: var(--muted);
    font-size: 12px;
  }
  .topbar {
    min-height: 72px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 40px;
    justify-content: space-between;
  }
  .breadcrumb {
    font-size: 14px;
    color: var(--muted);
  }
  .account {

    margin: auto;
    padding: 40px;

    align-items: flex-start;

    margin-bottom: 32px;

    line-height: 1.2;
    margin: 0 0 10px;
    letter-spacing: -0.03em;
  }

    line-height: 1.4;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  h3 {
    font-size: 18px;
    margin: 0 0 8px;
  }
  p {
    margin: 0 0 16px;
  }
  .muted {
    color: var(--muted);
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.07em;
    font-weight: 650;
    text-transform: uppercase;
    color: var(--muted);
  }
  .demo {
    font-size: 13px;
    border-left: 3px solid var(--navy);
    padding: 8px 16px;
    margin-bottom: 32px;
    color: var(--muted);
  }

    height: 1px;
    border: 0;
    margin: 32px 0;
    background: linear-gradient(
      to right,
      transparent,
      var(--line) 32px,
      var(--line) calc(100% - 32px),
      transparent
    );
    clip-path: polygon(
      0 50%,
      32px 0,
      calc(100% - 32px) 0,
      100% 50%,
      calc(100% - 32px) 100%,
      32px 100%
    );
  }
  .profile {
    display: flex;
    gap: 20px;
    align-items: center;
    flex-wrap: wrap;
  }
  .avatar {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #e9eef2;
    display: grid;
    place-items: center;
    font-size: 22px;
    font-weight: 600;
    color: var(--navy);
  }
  .profile dl {
    display: flex;
    flex-wrap: wrap;
    gap: 32px;
    margin: 0;
  }

    min-width: 0;
  }
  .profile dt {
    font-size: 12px;
    color: var(--muted);
  }
  .profile dd {
    margin: 4px 0 0;

    overflow-wrap: anywhere;
    min-width: 0;
  }

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    padding: 12px 0;
  }

    font-weight: 700;
    letter-spacing: -0.02em;

    flex-wrap: wrap;
    gap: 12px;
  }

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    margin: 0 0 20px;
  }

    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: end;
    margin: 20px 0;
  }
  .field {
    display: grid;
    gap: 8px;
    font-size: 14px;
  }
  .field input {
    width: min(340px, 100%);

    overflow-x: auto;
    max-width: 100%;
    border-bottom: 1px solid var(--line);

    border-collapse: collapse;
    text-align: left;
    font-size: 14px;
    min-width: 560px;

    font-weight: 500;
    font-size: 13px;
  }
  td,
  th {
    padding: 16px 12px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }

    border-bottom: 0;
  }
  tbody tr:hover {
    background: #f7f9fb;
  }
  td:first-child,
  th:first-child {
    padding-left: 0;
  }
  td small {
    display: block;
    color: var(--muted);
    margin-top: 4px;
  }
  table button {
    font-size: 13px;
    margin: 3px 6px 3px 0;
  }
  .under-table {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin-top: 18px;
    font-size: 13px;
    color: var(--muted);
  }
  .metrics {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 32px;
    padding: 24px 0;
  }
  .metric {
    border-right: 1px solid var(--line);
    padding-right: 24px;
  }
  .metric:last-child {
    border-right: 0;
  }
  .metric strong {
    display: block;
    font-size: 40px;
    line-height: 1.3;
    margin: 10px 0;
    color: var(--navy);
  }
  .metric span {
    font-size: 14px;
    color: var(--muted);
  }
  .status {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .status:before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--navy);
    flex-shrink: 0;
  }
  .empty {
    padding: 36px 0;
    color: var(--muted);
  }
  .session {

  }

  .menu-close {

  .session-footer {

    .page-heading {

    }
    .latest {
      align-items: flex-start;
      flex-direction: column;
    }
    .profile dl {
      gap: 20px;
    }
  }
  @media (max-width: 767px) {

      grid-template-columns: minmax(0, 1fr);
    }
    .sidebar {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5;
      overflow: auto;
      padding: 24px;
      background: var(--side);

    .sidebar.open {
      display: flex;
    }
    .menu-toggle,
    .menu-close {

      margin-bottom: 20px;

      flex-wrap: wrap;
    }
    .breadcrumb {
      display: none;
    }
    .account {
      max-width: 65%;
      font-size: 12px;
    }
    .page {
      padding: 28px 16px;
    }
    .page-heading {
      gap: 12px;
    }
    h1 {
      font-size: 29px;
    }
    .section-heading {
      align-items: flex-start;
      flex-direction: column;
      gap: 12px;
    }
    .metrics {
      grid-template-columns: 1fr;
      gap: 20px;
    }
    .metric {
      border-right: 0;
      border-bottom: 1px solid var(--line);
      padding-bottom: 20px;
    }
    .metric:last-child {
      border-bottom: 0;
    }
    .session {
      margin: 24px 16px;
    }
    .profile dl {
      flex-direction: column;
      gap: 12px;
    }
    .under-table {
      flex-wrap: wrap;
    }
    .month {
      font-size: 26px;
    }
    .actions {
      gap: 8px;
    }
  }
  @media (prefers-reduced-motion: reduce) {

      scroll-behavior: auto !important;

  .document-feedback {
    margin-bottom: 28px;
  }
  .document-feedback p {
    color: var(--muted);
    font-size: 14px;
  }
  .document-feedback button {
    margin-bottom: 16px;
  }
  #authorized-link {
    overflow-wrap: anywhere;
  }
</style>
